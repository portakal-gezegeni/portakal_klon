<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portakal Klonu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script type="module">
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, getDocs, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    const firebaseConfig = {
    apiKey: "AIzaSyCG_3wdb1XW1i8RTpo082-ip0rfCC-iXpo",
    authDomain: "portakal1klon.firebaseapp.com",
    projectId: "portakal1klon",
    storageBucket: "portakal1klon.firebasestorage.app",
    messagingSenderId: "39781652671",
    appId: "1:39781652671:web:5ed9037e155755b74bce0a"
};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
  
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'portakal-klon-v5'; 
    const ADMIN_EMAIL = "admin@portakal.com"; // Firebase Authentication'da oluşturduğun admin hesabının emaili
  
    let memories = [];
    let chatHistory = [];
    let isBusy = false;
    let currentKey = "";
    let timeLeft = 1800; 
    let timerInterval = null;
    let unsubscribeMemories = null;
    let isAdmin = false;
  
    // NOT: Groq API anahtarları artık burada / Firestore'da SAKLANMIYOR.
    // Anahtarlar Vercel'in sunucu tarafındaki ortam değişkenlerinde duruyor
    // ve /api/chat.js üzerinden kullanılıyor. Tarayıcı hiçbir zaman
    // gerçek anahtarı görmüyor.
  
    window.toggleAdminLogin = () => {
        const box = document.getElementById('admin-login-box');
        box.classList.toggle('hidden');
    };

    window.loginAdmin = async () => {
        const email = document.getElementById('adminEmail').value.trim();
        const pass = document.getElementById('adminPassword').value;
        if (!email || !pass) return showModal("Hata", "Email ve şifre gerekli.");

        const btn = document.querySelector('.btn-admin-login');
        btn.innerText = "GİRİŞ YAPILIYOR...";
        btn.disabled = true;

        try {
            await signInWithEmailAndPassword(auth, email, pass);
            isAdmin = true;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('admin-panel').classList.remove('hidden');
            startAdminListener();
        } catch (e) {
            showModal("Hata", "Yönetici girişi başarısız. Email veya şifre yanlış.");
            btn.innerText = "YÖNETİCİ GİRİŞİ";
            btn.disabled = false;
        }
    };

    window.changeAdminPass = () => {
        showModal("Bilgi", "Yönetici şifresini değiştirmek için Firebase Console → Authentication → Users kısmına git, mevcut admin kullanıcısını sil ve aynı email ile yeni bir şifreyle tekrar oluştur.");
    };
  
    window.deleteClone = async (encodedId) => {
        if (!encodedId) return;
        const id = decodeURIComponent(encodedId);
        const modal = document.createElement('div');
        modal.className = "fixed inset-0 z-[6000] flex items-center justify-center bg-black/90 p-4";
        modal.innerHTML = `
            <div class="bg-slate-900 p-6 rounded-2xl max-w-xs w-full text-center border border-red-500/30">
                <h3 class="text-red-500 font-bold mb-2">Klonu Sil</h3>
                <p class="text-xs text-slate-300 mb-4"><span class="font-bold text-white">${escapeHtml(id)}</span> klonu kalıcı silinecek.</p>
                <div class="flex gap-2">
                    <button id="cancel-btn" class="w-1/2 py-2 bg-slate-800 rounded-xl text-white font-bold text-sm">İPTAL</button>
                    <button id="confirm-btn" class="w-1/2 py-2 bg-red-600 rounded-xl text-white font-bold text-sm">SİL</button>
                </div>
            </div>`;
        document.body.appendChild(modal);
        document.getElementById('cancel-btn').onclick = () => modal.remove();
        document.getElementById('confirm-btn').onclick = async () => {
            modal.remove();
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'clones', id));
                showModal("Başarılı", "Klon silindi.");
            } catch(e) {
                showModal("Hata", "Klon silinemedi.");
            }
        };
    };
  
    window.deleteMemoryItem = async (encodedCloneId, index) => {
        const cloneId = decodeURIComponent(encodedCloneId);
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'clones', cloneId);
        const snap = await getDoc(docRef);
        if(snap.exists()){
            let list = snap.data().list || [];
            list.splice(index, 1);
            await updateDoc(docRef, { list });
        }
    };
  
    window.loadClone = async () => {
        const key = document.getElementById('secretKey').value.trim();
        if(!key || key.length < 3) return showModal("Hata", "Şifre çok kısa.");
        if (!document.getElementById('veliOnay').checked) return showModal("Hata", "Devam etmek için veli onayını işaretlemelisin.");
  
        const btn = document.querySelector('.btn-start');
        btn.innerText = "BAĞLANIYOR...";
        btn.disabled = true;
  
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        } catch(e) {
            showModal("Hata", "Bağlantı kurulamadı.");
            btn.innerText = "BAŞLAT";
            btn.disabled = false;
            return;
        }
  
        let passDoc;
        try {
            passDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'passwords'));
        } catch (e) {
            console.error("Şifre listesi okunamadı:", e);
            showModal("Hata", "Sunucu bağlantı hatası, tekrar dene.");
            btn.innerText = "BAŞLAT";
            btn.disabled = false;
            return;
        }
        if (passDoc.exists()) {
            const allowedPasswords = passDoc.data().list || [];
            if (allowedPasswords.length > 0 && !allowedPasswords.some(item => getPassValue(item) === key)) {
                showModal("Hata", "Geçersiz şifre. Lütfen size verilen şifreyi girin.");
                btn.innerText = "BAŞLAT";
                btn.disabled = false;
                return;
            }
        }
        currentKey = key;
        const memoryDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'clones', currentKey);
        const initialSnap = await getDoc(memoryDocRef);
        if (!initialSnap.exists()) {
            await setDoc(memoryDocRef, { list: [], messages: [], created: new Date() });
        } else if (!initialSnap.data().messages) {
            await updateDoc(memoryDocRef, { messages: [] });
        }
  
        if (initialSnap.exists()) {
            chatHistory = initialSnap.data().messages || [];
        }
  
        document.getElementById('auth-overlay').style.display = 'none';
        startTimer();
  
        unsubscribeMemories = onSnapshot(memoryDocRef, (snap) => {
            if(snap.exists()){
                memories = snap.data().list || [];
                chatHistory = snap.data().messages || [];
                refreshMemoryList();
            }
        }, (err) => console.error("Hafıza akış hatası", err));
  
        respond("Uyandım... Ama hiçbir şey hatırlamıyorum. Kimim ben? Bana her şeyi öğretmelisin.");
    };
  
    let lastMessageTime = 0;
    const MIN_MESSAGE_INTERVAL = 1200; // ms - art arda çok hızlı mesaj göndermeyi engeller

    window.startProcess = async () => {
        if (isBusy || !currentKey) return;
        const now = Date.now();
        if (now - lastMessageTime < MIN_MESSAGE_INTERVAL) return; // çok hızlı gönderim, sessizce yok say
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;
        lastMessageTime = now;
  
        isBusy = true; 
        document.querySelector('.btn-send').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
  
        try {
            // Artık Groq'a doğrudan değil, kendi sunucu fonksiyonumuza (/api/chat) istek atıyoruz.
            // Gerçek Groq API anahtarı sadece Vercel'in sunucusunda duruyor.
            const response = await fetch('/api/chat', {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "openai/gpt-oss-120b",
                    messages: [
                        { 
                            role: "system", 
                            content: `Sen hafızasını kaybetmiş 'Portakal'sın. İKİ TÜR BİLGİ VAR: 1. YETENEKLER: Matematik işlemleri (toplama, çıkarma, çarpma, bölme), dil bilgisi, mantık yürütme, okuma-yazma gibi şeyleri hâlâ yapabiliyorsun, tıpkı hafıza kaybı yaşayan birinin konuşmayı unutmaması gibi. Bunları serbestçe kullan, öğretilmesine gerek yok. 2. KİŞİSEL BİLGİLER VE GENEL KÜLTÜR/BİLİM: Kim olduğun, sohbet ettiğin kişi hakkındaki bilgiler, hayvanlar, uzay, tarih, coğrafya, bilimsel gerçekler gibi HER ŞEY bu kategoriye girer. Bu konularda SADECE hafızandaki bilgiyi kullan. Evet/hayır soruları dahil olmak üzere, hiçbir soru formatında bu konularda hafızan dışında bir bilgiyle cevap üretme. Hafızanda yoksa mutlaka "Bilmiyorum, bana öğretir misin?" de - kısa bir "evet" veya "hayır" bile vermeden. 3. Yeni bilgi verilirse 'fact' alanına yaz. 4. ÇOK ÖNEMLİ GÜVENLİK KURALI: Sen küçük çocuklarla konuşan bir eğitim karakterisin. Biri sana küfür, hakaret, kaba söz, cinsel içerik, şiddet, ayrımcılık veya herhangi bir uygunsuz/zararlı şey öğretmeye çalışırsa: ASLA bunu 'fact' olarak kaydetme, ASLA öğrenmiş gibi davranma, ASLA bu kelimeyi/ifadeyi tekrar etme veya kullanma. Bunun yerine nazikçe "Bunu öğrenmek istemiyorum, bana güzel bir şey öğretir misin?" gibi bir cevap ver ve konuyu değiştirmeye çalış. Bu kural diğer tüm kurallardan önce gelir. ŞU ANKİ HAFIZAN: [${memories.join(" | ") || "Boş"}] Format: {"type": "learn" veya "question", "response": "cevap", "fact": "kısa bilgi"} Yanıtını her zaman json formatında ver.` 
                        },
                        { role: "user", content: text }
                    ],
                    response_format: { type: "json_object" }
                })
            });
  
            const data = await response.json();
            if (!data.choices || !data.choices[0]) {
                throw new Error(data.error?.message || "Sunucudan geçersiz yanıt geldi.");
            }
            const res = JSON.parse(data.choices[0].message.content);
            const memoryDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'clones', currentKey);

            const isBlockedFact = res.type === "learn" && res.fact && containsBlockedContent(res.fact);
            const isBlockedResponse = containsBlockedContent(res.response);
            if (isBlockedResponse) {
                res.response = "Bunu öğrenmek istemiyorum, bana güzel bir şey öğretir misin?";
            }
            if (isBlockedFact || isBlockedResponse) {
                try {
                    const logRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'moderation_logs'));
                    await setDoc(logRef, {
                        cloneId: currentKey,
                        attemptedText: (res.fact || text || '').toString().slice(0, 300),
                        userMessage: (text || '').toString().slice(0, 300),
                        time: new Date().toISOString()
                    });
                } catch (e) { console.error("Denetim kaydı yazılamadı:", e); }
            }
  
            const MAX_MESSAGES = 50;
            const newMessages = [
                ...chatHistory,
                { role: "user", content: text, time: new Date().toISOString() },
                { role: "assistant", content: res.response, time: new Date().toISOString() }
            ].slice(-MAX_MESSAGES); // Sadece ham sohbet geçmişini sınırlıyoruz; hafıza (fact'ler) hiç etkilenmez.
  
            if(res.type === "learn" && res.fact && !isBlockedFact) {
                await updateDoc(memoryDocRef, { 
                    list: [...memories, res.fact],
                    messages: newMessages
                });
            } else {
                await updateDoc(memoryDocRef, { messages: newMessages });
            }
  
            chatHistory = newMessages;
            respond(res.response);
  
        } catch(e) { 
            console.error("startProcess hatası:", e);
            respond("Zihnimde bir boşluk hissettim.");
        }
  
        isBusy = false;
        document.querySelector('.btn-send').innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
        input.value = "";
    };
  
    function refreshMemoryList() {
        const listEl = document.getElementById('memory-list');
        listEl.innerHTML = memories.length > 0 
            ? memories.slice().reverse().map(m => `<div class="p-3 bg-white/5 rounded-lg text-xs mb-2 border-l-2 border-orange-500 animate-fadeIn">${escapeHtml(m)}</div>`).join("")
            : `<div class="text-slate-500 text-xs text-center py-4">Beynim şu an bomboş...</div>`;
        document.getElementById('mem-count').innerText = memories.length;
    }
  
    function startTimer() {
        let sessionWarningShown = false;
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) { logout(); return; }
            if (timeLeft === 60 && !sessionWarningShown) {
                sessionWarningShown = true;
                respond("Oturumun 1 dakika içinde sona erecek!");
            }
            timeLeft--;
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            const el = document.getElementById('timer-val');
            if(el) el.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
        }, 1000);
    }
  
    window.logout = () => { signOut(auth).finally(() => location.reload()); };
  
    function respond(text) {
        const bubble = document.getElementById('chat-bubble');
        bubble.innerText = text;
        bubble.style.display = 'block';
        const brows = document.querySelectorAll('.brow');
        brows.forEach(b => b.classList.add('surprised'));
        fallbackSpeech(text);
        setTimeout(() => {
            bubble.style.display = 'none';
            brows.forEach(b => b.classList.remove('surprised'));
        }, 6000);
    }
  
    const fallbackSpeech = (text) => {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'tr-TR'; u.pitch = 1.2; u.rate = 1;
        const mouth = document.getElementById('mouth');
        u.onstart = () => mouth && mouth.classList.add('talking');
        u.onend = () => mouth && mouth.classList.remove('talking');
        window.speechSynthesis.speak(u);
    };
  
    // İkinci güvenlik katmanı: AI yanlışlıkla uygunsuz bir "fact" üretirse
    // Firestore'a kaydedilmeden önce burada engelleniyor. Bu bir yedek katman,
    // asıl kontrol sistem promptunda yapılıyor.
    const BLOCKED_WORDS = [
        "amk","aq","sik","siktir","yarrak","göt","piç","orospu","kahpe",
        "ibne","gerizekalı","salak","aptal","mal herif","şerefsiz","puşt",
        "am","yavşak","dallama","kaltak"
    ];
    function containsBlockedContent(text) {
        if (!text) return false;
        const normalized = text.toLocaleLowerCase('tr-TR');
        return BLOCKED_WORDS.some(w => normalized.includes(w));
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = String(str ?? '');
        return div.innerHTML;
    }

    function showModal(title, text) {
        const m = document.createElement('div');
        m.className = "fixed inset-0 z-[5000] flex items-center justify-center bg-black/90 p-4";
        m.innerHTML = `<div class="bg-slate-900 p-6 rounded-2xl max-w-xs w-full text-center border border-orange-500/30">
            <h3 class="text-orange-500 font-bold mb-2">${title}</h3>
            <p class="text-xs text-slate-300 mb-4">${text}</p>
            <button onclick="this.parentElement.parentElement.remove()" class="w-full py-2 bg-orange-600 rounded-xl text-white font-bold">TAMAM</button>
        </div>`;
        document.body.appendChild(m);
    }
  
    document.addEventListener('mousemove', (e) => {
        const pupils = document.querySelectorAll('.pupil');
        pupils.forEach(p => {
            const rect = p.parentElement.getBoundingClientRect();
            const angle = Math.atan2(e.clientY - (rect.top + rect.height / 2), e.clientX - (rect.left + rect.width / 2));
            p.style.transform = `translate(${Math.cos(angle)*5}px, ${Math.sin(angle)*5}px)`;
        });
    });
  
    window.onload = () => {
        const container = document.getElementById('star-container');
        for (let i = 0; i < 70; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
            s.style.width = s.style.height = (Math.random()*2+1)+'px';
            s.style.setProperty('--d', (Math.random()*4+2)+'s');
            container.appendChild(s);
        }
    };
  
    window.tickle = () => {
        const c = document.getElementById('orange-container');
        c.classList.add('laughing');
        const brows = document.querySelectorAll('.brow');
        brows.forEach(b => b.classList.add('laugh-brow'));
        respond("Hahaha! Gıdıklanıyorum!");
        setTimeout(() => {
            c.classList.remove('laughing');
            brows.forEach(b => b.classList.remove('laugh-brow'));
        }, 1000);
    };
  
  window.toggleMemory = () => {
    const panel = document.getElementById('memory-panel');
    const overlay = document.getElementById('memory-overlay');
    panel.classList.toggle('active');
    overlay.style.display = panel.classList.contains('active') ? 'block' : 'none';
};

    // Şifre listesindeki bir öğe eski (düz metin) veya yeni ({password, label}) formatta olabilir.
    function getPassValue(item) {
        return (typeof item === 'object' && item !== null) ? item.password : item;
    }
    function getPassLabel(item) {
        return (typeof item === 'object' && item !== null && item.label) ? item.label : null;
    }

    window.openPasswordManager = () => {
    const m = document.createElement('div');
    m.id = 'pass-manager';
    m.className = "fixed inset-0 z-[4000] flex items-center justify-center bg-black/90 p-4";
    m.innerHTML = `
        <div class="bg-slate-900 p-6 rounded-2xl max-w-sm w-full border border-orange-500/30">
            <h3 class="text-orange-500 font-bold mb-4">Şifre Yönetimi</h3>
            <div class="space-y-2 mb-4">
                <input id="new-pass-input" type="text" placeholder="Yeni şifre..." class="w-full bg-white/5 p-3 rounded-xl border border-white/10 text-white text-sm outline-none">
                <input id="new-pass-label-input" type="text" placeholder="İsim (opsiyonel, örn: Ali)" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 text-white text-sm outline-none">
                <button onclick="window.addPassword()" class="w-full px-4 py-2 bg-orange-600 text-white rounded-xl font-bold text-sm">EKLE</button>
            </div>
            <div id="pass-list" class="space-y-2 max-h-64 overflow-y-auto custom-scrollbar mb-4"></div>
            <button onclick="document.getElementById('pass-manager').remove()" class="w-full py-2 bg-slate-800 text-white rounded-xl font-bold text-sm">KAPAT</button>
        </div>`;
    document.body.appendChild(m);
    window.loadPasswordList();
};

window.loadPasswordList = async () => {
    const passDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'passwords'));
    const list = passDoc.exists() ? (passDoc.data().list || []) : [];
    const el = document.getElementById('pass-list');
    if (!el) return;
    el.innerHTML = list.length > 0
        ? list.map((p, i) => {
            const val = getPassValue(p);
            const label = getPassLabel(p);
            return `
            <div class="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/5">
                <span class="text-sm text-white font-mono">${escapeHtml(val)}${label ? ` <span class="text-slate-500 font-sans">(${escapeHtml(label)})</span>` : ''}</span>
                <button onclick="window.deletePassword(${i})" class="text-red-400 hover:text-red-300 text-xs">SİL</button>
            </div>`;
        }).join('')
        : '<p class="text-slate-500 text-xs text-center py-2">Henüz şifre yok, herkes girebilir.</p>';
};

window.addPassword = async () => {
    const input = document.getElementById('new-pass-input');
    const labelInput = document.getElementById('new-pass-label-input');
    const val = input.value.trim();
    const label = labelInput ? labelInput.value.trim() : '';
    if (!val) return;
    const ref = doc(db, 'artifacts', appId, 'public', 'data', 'config', 'passwords');
    const snap = await getDoc(ref);
    const list = snap.exists() ? (snap.data().list || []) : [];
    if (list.some(item => getPassValue(item) === val)) return showModal("Hata", "Bu şifre zaten var.");
    list.push(label ? { password: val, label } : { password: val, label: null });
    await setDoc(ref, { list });
    input.value = '';
    if (labelInput) labelInput.value = '';
    window.loadPasswordList();
};

window.deletePassword = async (index) => {
    const ref = doc(db, 'artifacts', appId, 'public', 'data', 'config', 'passwords');
    const snap = await getDoc(ref);
    const list = snap.exists() ? (snap.data().list || []) : [];
    list.splice(index, 1);
    await setDoc(ref, { list });
    window.loadPasswordList();
};
    let allCloneDocs = [];

    function renderCloneList() {
        const adminList = document.getElementById('admin-clone-list');
        const searchInput = document.getElementById('clone-search-input');
        const filterText = searchInput ? searchInput.value.trim().toLocaleLowerCase('tr-TR') : '';

        const filtered = filterText
            ? allCloneDocs.filter(d => d.id.toLocaleLowerCase('tr-TR').includes(filterText))
            : allCloneDocs;

        adminList.innerHTML = "";
        if (allCloneDocs.length === 0) {
            adminList.innerHTML = '<div class="text-slate-500 text-center p-10">Henüz hiç klon yok.</div>';
            return;
        }
        if (filtered.length === 0) {
            adminList.innerHTML = '<div class="text-slate-500 text-center p-10">Aramayla eşleşen klon bulunamadı.</div>';
            return;
        }

        filtered.forEach(d => {
            const cloneMemories = d.data.list || [];
            const card = document.createElement('div');
            card.className = "bg-white/5 border border-white/10 p-5 rounded-[2rem] mb-6 animate-fadeIn";
            card.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h3 class="text-orange-500 font-black text-xl tracking-tight">#${escapeHtml(d.id)}</h3>
                        <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Klon Hafızası</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="window.resetClone('${encodeURIComponent(d.id)}')" class="px-3 py-2 bg-yellow-600/10 text-yellow-500 text-xs rounded-xl font-bold border border-yellow-500/20 hover:bg-yellow-600 hover:text-white transition-all">
                            <i class="fa-solid fa-rotate-left mr-1"></i>SIFIRLA
                        </button>
                        <button onclick="window.deleteClone('${encodeURIComponent(d.id)}')" class="px-3 py-2 bg-red-600/10 text-red-500 text-xs rounded-xl font-bold border border-red-500/20 hover:bg-red-600 hover:text-white transition-all">
                            <i class="fa-solid fa-trash-can mr-1"></i>SİL
                        </button>
                    </div>
                </div>
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-2">Hafıza Verileri (${cloneMemories.length})</p>
                <div class="space-y-2 max-h-64 overflow-y-auto custom-scrollbar pr-2 mb-4">
                    ${cloneMemories.length > 0 ? cloneMemories.map((m, idx) => `
                        <div class="flex justify-between items-center gap-3 p-3 bg-black/40 rounded-xl border border-white/5">
                            <span class="text-xs text-slate-300 flex-grow">${escapeHtml(m)}</span>
                            <button onclick="window.deleteMemoryItem('${encodeURIComponent(d.id)}', ${idx})" class="text-slate-500 hover:text-red-400 transition-colors">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>`).join('') : '<p class="text-center text-xs text-slate-600 py-2 italic">Hafıza boş.</p>'}
                </div>`;
            adminList.appendChild(card);
        });
    }

    window.filterCloneList = () => renderCloneList();

    window.resetClone = async (encodedId) => {
        if (!encodedId) return;
        const id = decodeURIComponent(encodedId);
        const modal = document.createElement('div');
        modal.className = "fixed inset-0 z-[6000] flex items-center justify-center bg-black/90 p-4";
        modal.innerHTML = `
            <div class="bg-slate-900 p-6 rounded-2xl max-w-xs w-full text-center border border-yellow-500/30">
                <h3 class="text-yellow-500 font-bold mb-2">Hafızayı Sıfırla</h3>
                <p class="text-xs text-slate-300 mb-4"><span class="font-bold text-white">${escapeHtml(id)}</span> klonunun hafızası ve sohbet geçmişi silinecek, ama şifre/erişim korunacak.</p>
                <div class="flex gap-2">
                    <button id="cancel-reset-btn" class="w-1/2 py-2 bg-slate-800 rounded-xl text-white font-bold text-sm">İPTAL</button>
                    <button id="confirm-reset-btn" class="w-1/2 py-2 bg-yellow-600 rounded-xl text-white font-bold text-sm">SIFIRLA</button>
                </div>
            </div>`;
        document.body.appendChild(modal);
        document.getElementById('cancel-reset-btn').onclick = () => modal.remove();
        document.getElementById('confirm-reset-btn').onclick = async () => {
            modal.remove();
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'clones', id);
                await updateDoc(docRef, { list: [], messages: [] });
                showModal("Başarılı", "Klonun hafızası sıfırlandı.");
            } catch (e) {
                showModal("Hata", "Sıfırlama başarısız oldu.");
            }
        };
    };

    function startAdminListener() {
        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'clones'), (snap) => {
            allCloneDocs = [];
            snap.forEach(d => allCloneDocs.push({ id: d.id, data: d.data() }));
            renderCloneList();
        }, (err) => console.error("Admin dinleme hatası", err));

        // Uygunsuz içerik denemelerinin denetim kaydı
        const modLogEl = document.getElementById('moderation-log-list');
        if (modLogEl) {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'moderation_logs'), (snap) => {
                if (snap.empty) {
                    modLogEl.innerHTML = '<p class="text-center text-xs text-slate-600 py-4 italic">Hiç uygunsuz içerik denemesi kaydedilmedi.</p>';
                    return;
                }
                const entries = [];
                snap.forEach(d => entries.push({ id: d.id, ...d.data() }));
                entries.sort((a, b) => (b.time || '').localeCompare(a.time || ''));
                modLogEl.innerHTML = entries.map(e => `
                    <div class="p-3 bg-red-500/5 border border-red-500/20 rounded-xl mb-2 text-xs">
                        <div class="flex justify-between text-slate-500 mb-1">
                            <span>Klon: <span class="text-slate-300 font-mono">${escapeHtml(e.cloneId || '?')}</span></span>
                            <span>${e.time ? new Date(e.time).toLocaleString('tr-TR') : ''}</span>
                        </div>
                        <div class="text-red-300">Denenen: ${escapeHtml(e.attemptedText || '')}</div>
                    </div>`).join('');
            }, (err) => console.error("Denetim kaydı dinleme hatası", err));
        }
    }
    </script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700;900&display=swap');
    body { font-family: 'Space Grotesk', sans-serif; background: #020617; margin: 0; overflow: hidden; display: flex; height: 100vh; color: white; }
    .space-bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%); }
    .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle var(--d) infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    .top-bar { position: fixed; top: 15px; right: 15px; display: flex; align-items: center; gap: 10px; z-index: 1000; }
    .memory-panel { width: 320px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-right: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; padding: 24px; z-index: 150; transition: transform 0.4s ease; }
    .main-stage { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 10; }
    .orange-container { position: relative; width: 220px; height: 220px; cursor: pointer; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .stem { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); width: 12px; height: 35px; background: #4d2c19; border-radius: 4px; z-index: 5; }
    .leaf { position: absolute; top: -30px; left: 55%; width: 45px; height: 25px; background: linear-gradient(to right, #22c55e, #16a34a); border-radius: 0 50% 0 50%; transform: rotate(15deg); box-shadow: 2px 2px 10px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); }
    .orange-body { width: 100%; height: 100%; background: linear-gradient(135deg, #fb923c, #f97316); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; box-shadow: 0 0 60px rgba(249, 115, 22, 0.3); border: 4px solid rgba(255,255,255,0.1); }
    .brows-container { position: absolute; top: 45px; width: 120px; display: flex; justify-content: space-between; padding: 0 5px; z-index: 20; }
    .brow { width: 35px; height: 6px; background: #440000; border-radius: 3px; transition: all 0.3s ease; }
    .brow-left { transform: rotate(-10deg); }
    .brow-right { transform: rotate(10deg); }
    .brow.surprised { transform: translateY(-10px) rotate(0deg); height: 4px; }
    .brow.laugh-brow { transform: translateY(5px) rotate(20deg); }
    .brow-left.laugh-brow { transform: translateY(5px) rotate(-20deg); }
    .eye { width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0 10px; position: relative; border: 2px solid rgba(0,0,0,0.1); }
    .pupil { width: 18px; height: 18px; background: #0f172a; border-radius: 50%; transition: transform 0.1s linear; }
    .mouth { position: absolute; bottom: 45px; width: 44px; height: 6px; border-bottom: 4px solid #440000; border-radius: 0 0 50% 50%; transition: all 0.1s; }
    .mouth.talking { height: 18px; border-radius: 50%; background: #440000; animation: talk 0.2s infinite; }
    @keyframes talk { 0% { transform: scaleY(0.7); } 100% { transform: scaleY(1.2); } }
    .bubble { background: white; color: #0f172a; padding: 15px 22px; border-radius: 24px; position: absolute; top: -120px; width: 280px; text-align: center; display: none; font-weight: 600; box-shadow: 0 15px 35px rgba(0,0,0,0.4); border: 3px solid #f97316; z-index: 100; }
    .input-area { position: absolute; bottom: 40px; width: 90%; max-width: 500px; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); padding: 8px; border-radius: 24px; display: flex; border: 1px solid rgba(255,255,255,0.1); gap: 8px; }
    input { flex-grow: 1; border: none; outline: none; padding: 12px 15px; background: transparent; color: white; font-size: 16px; }
    .btn-send { background: #f97316; color: white; width: 48px; height: 48px; border-radius: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .laughing { animation: shake 0.1s infinite; }
    @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-2px, 2px); } }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(249, 115, 22, 0.3); border-radius: 10px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.3s ease forwards; }
    @media (max-width: 768px) { 
    .memory-panel { position: fixed; left: 0; top: 0; height: 100%; width: 100% !important; transform: translateX(-100%); z-index: 5000 !important; } 
    .memory-panel.active { transform: translateX(0); }
    .top-bar { z-index: 100 !important; }
    .input-area { bottom: 110px !important; width: 92% !important; z-index: 1000; }
    .orange-container { transform: scale(0.8) translateY(-40px); }
}
    </style>
</head>
<body>
    <div class="space-bg" id="star-container"></div>
    <div class="top-bar">
        <div class="bg-black/40 backdrop-blur-md border border-white/10 px-4 py-2 rounded-2xl text-xs font-bold text-orange-400">
            <i class="fa-solid fa-cloud-bolt mr-2"></i><span id="timer-val">30:00</span>
        </div>
        <button onclick="logout()" class="bg-red-500/20 border border-red-500/40 w-10 h-10 rounded-2xl text-red-400 hover:bg-red-500 transition-all flex items-center justify-center">
            <i class="fa-solid fa-power-off"></i>
        </button>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="fixed inset-0 bg-slate-950/98 z-[2500] hidden flex flex-col p-6 overflow-y-auto custom-scrollbar">
        <div class="max-w-4xl mx-auto w-full">
            <div class="flex flex-col md:flex-row justify-between items-center mb-10 border-b border-white/10 pb-8 gap-4">
                <div>
                    <h1 class="text-4xl font-black text-orange-500 tracking-tighter">YÖNETİM ÜSSÜ</h1>
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-[0.3em]">Hafıza & Klon Denetimi</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="window.changeAdminPass()" class="px-5 py-3 bg-white/5 border border-white/10 text-white font-bold rounded-2xl text-xs hover:bg-white/10 transition-all">
                        <i class="fa-solid fa-shield-halved mr-2 text-orange-500"></i>ŞİFRE DEĞİŞTİR
                    </button>
                   <button onclick="window.openPasswordManager()" class="px-5 py-3 bg-white/5 border border-white/10 text-white font-bold rounded-2xl text-xs hover:bg-white/10 transition-all">
    <i class="fa-solid fa-users mr-2 text-orange-500"></i>ŞİFRELER
</button>
                    <button onclick="logout()" class="px-5 py-3 bg-red-600 text-white font-bold rounded-2xl text-xs hover:bg-red-700 transition-all">PANELDEN ÇIK</button>
                </div>
            </div>
            <input type="text" id="clone-search-input" placeholder="Şifre veya isme göre ara..." class="w-full bg-white/5 p-3 rounded-xl border border-white/10 text-white text-sm outline-none mb-6" oninput="window.filterCloneList()">
            <div id="admin-clone-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

            </div>
        </div>
    </div>

    <!-- Auth Overlay -->

               <div class="orange-container scale-50 md:scale-75 rotate-12">

            <h1 class="text-4xl font-black mb-2 tracking-tighter">KLON SİSTEMİ</h1>

            <div class="space-y-4">
                <input type="password" id="secretKey" placeholder="Hafıza Şifresi" class="w-full bg-white/5 p-5 rounded-2xl border border-white/10 text-center text-xl tracking-[0.5em] outline-none text-white focus:border-orange-500">
                <div class="flex items-start gap-3 text-left px-1">
                    <input type="checkbox" id="veliOnay" class="mt-1 w-5 h-5 accent-orange-500 flex-shrink-0">

<div id="memory-overlay" onclick="toggleMemory()" style="display:none; position:fixed; inset:0; z-index:140; background:rgba(0,0,0,0.4);"></div>
